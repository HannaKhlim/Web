<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPDC - Catalog</title>
    <link rel="stylesheet" href="finance.css">
    <link rel="stylesheet" href="catalog.css">
</head>
<body>
    <header>
        <img src="public/logo.png" alt="Logo">
        <nav>
            <div class="nav-item"><a href="finance.html">HOME</a></div>
            <div class="nav-item"><a href="#">CATALOG</a></div>
        </nav>
    </header>

    <section class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or description...">
        <select id="sortSelect" class="btn-white" style="padding: 5px 10px; cursor:pointer;">
            <option value="default">Sort by...</option>
            <option value="name">Name (A-Z)</option>
            <option value="rate">Interest Rate (Low to High)</option>
        </select>

        <div class="methods-grid" id="methodsButtons">
            </div>
    </section>

    <div id="services-container"></div>

    <script src="catalog.js"></script>
</body>
</html>
